services:
  lite:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-cloudnativegis-processing}:${TAG:-latest}
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ${DATA_DIR:-./data}:/data
      # Downloads and conversions are worked on here
      - work:/tmp/cng-lite
    restart: unless-stopped

volumes:
  work:
