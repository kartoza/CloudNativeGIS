name: Release Processing

on:
  push:
    tags:
      - 'v*-processing'

jobs:
  # =============================================================================
  # Build, Smoke Test and Push Processing Docker Image
  # =============================================================================
  docker:
    name: Build Processing Docker Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          # v1.2.3-processing -> 1.2.3
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION%-processing}
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Tag ${GITHUB_REF#refs/tags/} is not of the form vX.Y.Z-processing" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # GHCR image names must be lowercase
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloudnativegis-processing" >> $GITHUB_OUTPUT

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          # Pre-releases (1.2.3-rc1) only get their exact tag; stable
          # releases also move X.Y, X and latest.
          TAGS="$IMAGE:$VERSION"
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            TAGS="$TAGS,$IMAGE:$MAJOR.$MINOR,$IMAGE:$MAJOR,$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: processing
          file: processing/Dockerfile
          load: true
          tags: cloudnativegis-processing:test
          cache-from: type=gha,scope=processing
          cache-to: type=gha,scope=processing,mode=max

      - name: Smoke test
        run: make -C processing smoke-test IMAGE=cloudnativegis-processing TAG=test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: processing
          file: processing/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=cloudnativegis-processing
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=processing
          cache-to: type=gha,scope=processing,mode=max
          platforms: linux/amd64,linux/arm64

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  github-release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: changelog
        env:
          VERSION: ${{ needs.docker.outputs.version }}
          IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          # Previous processing tag; only commits touching processing/ (lite/ before the rename) are listed
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*-processing' HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to HEAD"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD -- processing lite)
          else
            echo "No previous processing tag found, using recent processing commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" -20 -- processing lite)
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## Cloud Native GIS Processing v${VERSION}

          ### Installation

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          docker run --rm -p 8000:8000 ${IMAGE}:${VERSION}
          \`\`\`

          ### Changes

          ${CHANGELOG}

          ### Documentation

          - [Processing README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/processing/README.md)

          ---

          Made with 💗 by [Kartoza](https://kartoza.com)
          EOF
          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.docker.outputs.version }} (processing)
          body_path: ${{ steps.changelog.outputs.notes_file }}
          draft: false
          prerelease: ${{ contains(needs.docker.outputs.version, 'alpha') || contains(needs.docker.outputs.version, 'beta') || contains(needs.docker.outputs.version, 'rc') }}
          make_latest: false
